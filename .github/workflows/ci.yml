name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  eval:
    name: Eval
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python -m rag.eval.runner --dataset evals/qa_dataset.jsonl --fail-under-recall 0.70 --fail-under-groundedness 0.40

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          tags: rag-citations-service:latest
          load: true
      - run: docker compose up --build -d
      - run: |
          timeout 30s bash -c 'until curl --fail --silent http://localhost:8000/readyz; do sleep 1; done'
      - run: |
          curl -s -X POST http://localhost:8000/query \
            -H 'Content-Type: application/json' \
            -d '{"question": "What are the four functions of the NIST AI Risk Management Framework?"}' \
            | python -m json.tool
      - run: docker compose down --rmi local --volumes
